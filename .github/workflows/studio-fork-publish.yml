name: Publish Studio (fork)

# Builds the forked Studio image and pushes it to GHCR, where the Coolify
# stack pulls it from. Upstream's publish_image.yml builds two architectures
# and merges a manifest; this fork only ever runs on linux/amd64, so there is
# one job and no manifest step.

on:
  push:
    branches:
      - main
    # The platform stack and its control plane are not part of the Studio image.
    paths-ignore:
      - 'deploy/**'
      - 'apps/control-plane/**'
  workflow_dispatch:
    inputs:
      multi_project:
        description: Build the multi-project switcher in (NEXT_PUBLIC_IS_MULTI_PROJECT)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

# Two pushes in quick succession would otherwise race to tag `latest`, and the
# slower build wins it — leaving `latest` pointing at the older commit. One run
# per ref at a time; a superseded run is cancelled before it can push.
# The multi-project build has tags of its own, so it does not cancel the plain one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.multi_project && 'platform' || 'plain' }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/krowli/supabase-full-access-studio
          # `latest` (single-project Studio) only from a plain build on main. The
          # multi-project build for the platform (deploy/platform/platform-compose.yaml)
          # is dispatched with multi_project and gets `platform` and `platform-<date>-sha-…`
          # instead. A run dispatched on another branch gets that branch's name as its tag.
          tags: |
            type=sha,prefix=${{ inputs.multi_project && 'platform-' || '' }}{{date 'YYYY.MM.DD'}}-sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && !inputs.multi_project }}
            type=raw,value=platform,enable=${{ github.ref == 'refs/heads/main' && inputs.multi_project == true }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/main' }}

      # apps/studio/Dockerfile declares one ARG, STUDIO_FRAMEWORK, and defaults
      # it to `next`. Upstream passes no build-args and rides that default.
      # This fork pins it instead: only the Next routes are built and exercised
      # here, so a change to the Dockerfile's default must not silently start
      # shipping the TanStack build with no diff in this file to show for it.
      # NEXT_PUBLIC_IS_MULTI_PROJECT is the fork's own ARG: `true` only when a
      # manual run asks for it, so a push to main always builds it off.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/studio/Dockerfile
          target: production
          platforms: linux/amd64
          push: true
          build-args: |
            STUDIO_FRAMEWORK=next
            NEXT_PUBLIC_IS_MULTI_PROJECT=${{ inputs.multi_project && 'true' || 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
