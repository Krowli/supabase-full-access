# The shared platform stack: one Coolify service on the database server (deploy/platform/SPEC.md
# §5, §12). The control plane in this stack creates the project stacks (project-compose.yaml).
#
# Networking: the Coolify service has "Connect to Predefined Network" on (API:
# connect_to_docker_network: true), so every container here also sits on the shared `coolify`
# network as <service>-<this-service-uuid>, and reaches project containers as
# supabase-{db,auth,rest,storage}-<project-service-uuid>. Inside this stack the short names
# (kong, realtime, minio, ...) work. Nothing is published except Kong's proxy on the WireGuard
# address, where the gateway host's Traefik sends *.<PROJECT_DOMAIN_SUFFIX>, and the control
# plane's port for the gateway host to read /hosts (the API itself needs CONTROL_PLANE_TOKEN).
# Studio (multi-project) is reached only through Kong, at studio.<PROJECT_DOMAIN_SUFFIX> with
# basic auth (DASHBOARD_USERNAME / DASHBOARD_PASSWORD; the control plane renders that route).
#
# Env (Coolify service env, all secrets generated outside Coolify):
#   PLATFORM_DB_PASSWORD, PLATFORM_ADMIN_JWT_SECRET (Supavisor and Realtime admin API, later
#   Studio), SUPAVISOR_SECRET_KEY_BASE, SUPAVISOR_VAULT_ENC_KEY (32 chars),
#   REALTIME_SECRET_KEY_BASE, REALTIME_DB_ENC_KEY (16 chars), PG_META_CRYPTO_KEY,
#   MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, KONG_ADMIN_TOKEN, CONTROL_PLANE_TOKEN,
#   PLATFORM_SECRETS_KEY, CP_COOLIFY_URL, CP_COOLIFY_TOKEN, CP_COOLIFY_PROJECT_UUID,
#   CP_COOLIFY_ENVIRONMENT, CP_COOLIFY_SERVER_UUID (prefixed so they cannot collide with the
#   COOLIFY_* variables Coolify sets itself), PROJECT_DOMAIN_SUFFIX, PROJECT_S3_ENDPOINT (http://minio-<this-uuid>:9000),
#   PROJECT_IMGPROXY_URL (http://imgproxy-<this-uuid>:8080), DASHBOARD_USERNAME,
#   DASHBOARD_PASSWORD, STUDIO_INTERNAL_URL (http://studio-<this-uuid>:3000).
services:
  platform-db:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_PASSWORD=${PLATFORM_DB_PASSWORD}'
    # Metadata only (Supavisor, Realtime, the registry): small buffers.
    command: postgres -c shared_buffers=64MB -c work_mem=2MB -c maintenance_work_mem=32MB -c max_connections=100
    volumes:
      - 'platform-db-data:/var/lib/postgresql/data'
      -
        type: bind
        source: ./init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        # _supabase: Supavisor's metadata and the control plane's _platform schema.
        # _realtime (in postgres): Realtime's tenants.
        content: |
          create database _supabase;
          create schema if not exists _realtime;
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  kong:
    image: 'kong/kong:3.9.1'
    # The admin API listens on the container networks only (never published or routed) and
    # answers only requests that carry the x-admin-token header: the `coolify` network is
    # shared with every other Coolify service on this server. The guard is an nginx `if` in the
    # admin server block, written from KONG_ADMIN_TOKEN at start.
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        printf 'if ($$http_x_admin_token != "%s") { return 401; }\n' "$$KONG_ADMIN_TOKEN" > /tmp/admin-guard.conf
        exec /entrypoint.sh kong docker-start
    environment:
      - KONG_DATABASE=off
      - 'KONG_ADMIN_LISTEN=0.0.0.0:8001'
      - 'KONG_PROXY_LISTEN=0.0.0.0:8000'
      - KONG_NGINX_ADMIN_INCLUDE=/tmp/admin-guard.conf
      - 'KONG_ADMIN_TOKEN=${KONG_ADMIN_TOKEN}'
      # The control plane applies the whole declarative config with POST /config (src/kong.ts).
      - 'KONG_PLUGINS=request-transformer,cors,key-auth,acl,request-termination,post-function,basic-auth'
      - 'KONG_DNS_ORDER=LAST,A,CNAME'
      - KONG_DNS_NOT_FOUND_TTL=1
      - KONG_NGINX_WORKER_PROCESSES=2
      - KONG_MEM_CACHE_SIZE=32m
      - KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k
      # PostgREST filters like .in('col', [200 hashes]) build ~13 KB URLs; nginx's default
      # 8 KB header buffer answers 414 (same as deploy/coolify/docker-compose.yaml).
      - 'KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS=4 32k'
      - 'KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k'
      - 'KONG_PROXY_ACCESS_LOG=/dev/stdout combined'
    ports:
      - '10.10.0.1:8010:8000'
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 5

  supavisor:
    image: 'supabase/supavisor:2.7.4'
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - PORT=4000
      - 'DATABASE_URL=ecto://postgres:${PLATFORM_DB_PASSWORD}@platform-db:5432/_supabase'
      - CLUSTER_POSTGRES=true
      - 'SECRET_KEY_BASE=${SUPAVISOR_SECRET_KEY_BASE}'
      - 'VAULT_ENC_KEY=${SUPAVISOR_VAULT_ENC_KEY}'
      - 'API_JWT_SECRET=${PLATFORM_ADMIN_JWT_SECRET}'
      - 'METRICS_JWT_SECRET=${PLATFORM_ADMIN_JWT_SECRET}'
      - REGION=local
      - 'ERL_AFLAGS=-proto_dist inet_tcp'
      - DB_POOL_SIZE=3
    command: ['/bin/sh', '-c', '/app/bin/migrate && /app/bin/server']
    healthcheck:
      test: [CMD, curl, '-sSfL', '-o', /dev/null, 'http://127.0.0.1:4000/api/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  realtime:
    image: 'supabase/realtime:v2.76.5'
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - PORT=4000
      - DB_HOST=platform-db
      - DB_PORT=5432
      - DB_USER=postgres
      - 'DB_PASSWORD=${PLATFORM_DB_PASSWORD}'
      - DB_NAME=postgres
      - 'DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime'
      - 'DB_ENC_KEY=${REALTIME_DB_ENC_KEY}'
      - 'API_JWT_SECRET=${PLATFORM_ADMIN_JWT_SECRET}'
      - 'SECRET_KEY_BASE=${REALTIME_SECRET_KEY_BASE}'
      - 'METRICS_JWT_SECRET=${PLATFORM_ADMIN_JWT_SECRET}'
      - 'ERL_AFLAGS=-proto_dist inet_tcp'
      - "DNS_NODES=''"
      - RLIMIT_NOFILE=10000
      - APP_NAME=realtime
      # Tenants come from the control plane only; the self-host seed would recreate a default.
      - SEED_SELF_HOST=false
      - RUN_JANITOR=false
      - LOG_LEVEL=error
      - DISABLE_HEALTHCHECK_LOGGING=true
    command: sh -c "/app/bin/migrate && /app/bin/server"
    healthcheck:
      test: [CMD, curl, '-sSf', '-o', /dev/null, 'http://127.0.0.1:4000/healthcheck']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-meta:
    image: 'supabase/postgres-meta:v0.99.0'
    environment:
      - PG_META_PORT=8080
      # Studio sends every query with an x-connection-encrypted header (encrypted with
      # PG_META_CRYPTO_KEY). The default connection points nowhere, so a request without that
      # header cannot reach any database.
      - PG_META_DB_HOST=127.0.0.1
      - PG_META_DB_PORT=1
      - PG_META_DB_NAME=none
      - PG_META_DB_USER=none
      - PG_META_DB_PASSWORD=none
      - 'CRYPTO_KEY=${PG_META_CRYPTO_KEY}'

  imgproxy:
    image: 'darthsim/imgproxy:v3.30.1'
    # Sources are presigned MinIO URLs from each project's storage-api; no local files.
    environment:
      - 'IMGPROXY_BIND=:8080'
      - IMGPROXY_USE_ETAG=true
      - IMGPROXY_AUTO_WEBP=true
      - IMGPROXY_MAX_SRC_RESOLUTION=16.8
    healthcheck:
      test: [CMD, imgproxy, health]
      interval: 5s
      timeout: 5s
      retries: 3

  minio:
    image: 'ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z'
    # Buckets (one per project, named after the ref) and their scoped keys are created by the
    # control plane (apps/control-plane/src/minio.ts), so there is no bootstrap container.
    environment:
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
      - MINIO_BROWSER=off
    command: 'server /data'
    volumes:
      - 'minio-data:/data'
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 20s
      retries: 10

  control-plane:
    # Built by .github/workflows/control-plane-publish.yml. deploy.sh fills in the tag.
    image: 'ghcr.io/krowli/supabase-control-plane:{{CONTROL_PLANE_TAG}}'
    # Tags are immutable (sha-<commit>); an image built on the server is used as it is.
    pull_policy: missing
    depends_on:
      platform-db:
        condition: service_healthy
      kong:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - PORT=8080
      - 'COOLIFY_URL=${CP_COOLIFY_URL}'
      - 'COOLIFY_TOKEN=${CP_COOLIFY_TOKEN}'
      - 'COOLIFY_PROJECT_UUID=${CP_COOLIFY_PROJECT_UUID}'
      - 'COOLIFY_ENVIRONMENT=${CP_COOLIFY_ENVIRONMENT}'
      - 'COOLIFY_SERVER_UUID=${CP_COOLIFY_SERVER_UUID}'
      - 'REGISTRY_DATABASE_URL=postgres://postgres:${PLATFORM_DB_PASSWORD}@platform-db:5432/_supabase'
      - 'PLATFORM_SECRETS_KEY=${PLATFORM_SECRETS_KEY}'
      - 'CONTROL_PLANE_TOKEN=${CONTROL_PLANE_TOKEN}'
      - 'PROJECT_DOMAIN_SUFFIX=${PROJECT_DOMAIN_SUFFIX}'
      - 'PROJECT_S3_ENDPOINT=${PROJECT_S3_ENDPOINT}'
      - 'PROJECT_IMGPROXY_URL=${PROJECT_IMGPROXY_URL}'
      - 'KONG_ADMIN_URL=http://kong:8001'
      - 'KONG_ADMIN_TOKEN=${KONG_ADMIN_TOKEN}'
      - 'SUPAVISOR_URL=http://supavisor:4000'
      - 'REALTIME_URL=http://realtime:4000'
      - 'PLATFORM_ADMIN_JWT_SECRET=${PLATFORM_ADMIN_JWT_SECRET}'
      - 'MINIO_URL=http://minio:9000'
      - 'MINIO_ROOT_USER=${MINIO_ROOT_USER}'
      - 'MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}'
      # Kong routes studio.<suffix> to Studio with basic auth (src/kong.ts, renderDashboard).
      - 'DASHBOARD_URL=http://studio:3000'
      - 'DASHBOARD_USERNAME=${DASHBOARD_USERNAME}'
      - 'DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}'
    ports:
      - '10.10.0.1:8011:8080'

  studio:
    # Multi-project Studio (built with NEXT_PUBLIC_IS_MULTI_PROJECT=true; deploy.py fills in the
    # image, pinned by digest). Every project comes from the control plane (SPEC.md §11-§12).
    image: '{{STUDIO_IMAGE}}'
    depends_on:
      control-plane:
        condition: service_started
      postgres-meta:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 30s
    environment:
      - HOSTNAME=0.0.0.0
      # The registry: the control plane in this stack (same service network, short name).
      - 'STUDIO_PROJECT_REGISTRY_URL=http://control-plane:8080'
      - 'STUDIO_PROJECT_REGISTRY_TOKEN=${CONTROL_PLANE_TOKEN}'
      - 'STUDIO_PROJECT_DOMAIN_SUFFIX=${PROJECT_DOMAIN_SUFFIX}'
      # No single-project stack here: `default` is the project list, not a database (SPEC.md §15).
      - STUDIO_DEFAULT_PROJECT=none
      - 'DEFAULT_ORGANIZATION_NAME=Platform (staging)'
      # Shared services. pg-meta only reaches a database through Studio's encrypted header.
      - 'STUDIO_PG_META_URL=http://postgres-meta:8080'
      - 'PG_META_CRYPTO_KEY=${PG_META_CRYPTO_KEY}'
      - 'PLATFORM_ADMIN_JWT_SECRET=${PLATFORM_ADMIN_JWT_SECRET}'
      - 'SUPAVISOR_URL=http://supavisor:4000'
      - POOLER_PROXY_PORT_TRANSACTION=6543
      - 'REALTIME_URL=http://realtime:4000'
      # Project GoTrue containers fetch email templates from here over the `coolify` network.
      - 'STUDIO_INTERNAL_URL=${STUDIO_INTERNAL_URL}'
      - SNIPPETS_MANAGEMENT_FOLDER=/app/snippets
      - ENABLED_FEATURES_AUTHENTICATION_THIRD_PARTY_AUTH=false
      - UPLOAD_FILE_SIZE_LIMIT=524288000
    volumes:
      - 'studio-snippets:/app/snippets'
      # Per-project GoTrue, storage and state files Studio writes (<ref>/{gotrue,storage,state})
      # under its fixed projectsDir; on the host they live under the platform's own path.
      - '/data/supa-platform-staging/projects:/data/pieowl/projects'

volumes:
  platform-db-data:
  minio-data:
  studio-snippets:
