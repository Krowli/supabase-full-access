# The shared platform stack (deploy/platform/SPEC.md §5, §12), installed as one Coolify
# application: + New → Public Repository → this repo, branch main, Build Pack
# "Docker Compose", Docker Compose Location /deploy/platform/platform-compose.yaml, server = the
# database server. The control plane in this stack creates the project stacks (project-compose.yaml).
#
# Secrets are Coolify magic variables (SERVICE_PASSWORD_*, SERVICE_USER_*, SERVICE_HEX_*): Coolify
# generates them on the first deploy and shows them under Environment Variables. Names have no
# underscore after the generator (Coolify's parseCommandFromMagicEnvVariable). The only value to
# fill in is CONTROL_PLANE_COOLIFY_TOKEN (a Coolify API token, write access); the other plain
# variables come with defaults.
#
# Networking: every container except platform-db and projects-dir joins the shared `coolify`
# network (declared below, so no "Connect to Predefined Network" checkbox). Other stacks reach this
# one by the supa-platform-* aliases: project stacks use minio, imgproxy and studio; verify.py the
# rest. The aliases are fixed, so there is one platform per server. (Compose also gives each
# container its short service name there; project stacks name theirs supabase-*.) Inside this stack the short names
# (kong, realtime, minio, ...) work; project containers are supabase-{db,auth,rest,storage}-<uuid>.
# Nothing is published except on the WireGuard address: Kong's proxy (the gateway host's Traefik
# sends *.<PROJECT_DOMAIN_SUFFIX> to it), the control plane's port (the gateway's sync container,
# gateway/compose.yaml, reads /hosts; the API itself needs the control-plane token) and Supavisor's
# two pooler ports, for apps on the gateway host that use a project's Postgres. Studio
# (multi-project) is reached only through Kong, at studio.<PROJECT_DOMAIN_SUFFIX> with basic auth
# (SERVICE_USER_STUDIO / SERVICE_PASSWORD_STUDIO; the control plane renders that route).
#
# /data/supa-platform/projects on the host holds every project's settings files,
# <ref>/{gotrue,storage,state}: Studio writes them, each project's GoTrue and storage-api read
# their own, and the control plane creates and removes <ref>/ (SPEC.md §16).
services:
  platform-db:
    image: 'postgres:17-alpine'
    environment:
      - 'POSTGRES_PASSWORD=${SERVICE_PASSWORD_PLATFORMDB}'
    # Metadata only (Supavisor, Realtime, the registry): small buffers.
    command: postgres -c shared_buffers=64MB -c work_mem=2MB -c maintenance_work_mem=32MB -c max_connections=100
    volumes:
      - 'platform-db-data:/var/lib/postgresql/data'
      -
        type: bind
        source: ./init.sql
        target: /docker-entrypoint-initdb.d/init.sql
        # _supabase: Supavisor's metadata and the control plane's _platform schema.
        # _realtime (in postgres): Realtime's tenants.
        content: |
          create database _supabase;
          create schema if not exists _realtime;
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 20

  kong:
    image: 'kong/kong:3.9.1'
    # The admin API listens on the container networks only (never published or routed) and
    # answers only requests that carry the x-admin-token header: the `coolify` network is
    # shared with every other Coolify service on this server. The guard is an nginx `if` in the
    # admin server block, written from KONG_ADMIN_TOKEN at start.
    entrypoint:
      - /bin/sh
      - '-c'
      - |
        printf 'if ($$http_x_admin_token != "%s") { return 401; }\n' "$$KONG_ADMIN_TOKEN" > /tmp/admin-guard.conf
        exec /entrypoint.sh kong docker-start
    environment:
      - KONG_DATABASE=off
      - 'KONG_ADMIN_LISTEN=0.0.0.0:8001'
      - 'KONG_PROXY_LISTEN=0.0.0.0:8000'
      - KONG_NGINX_ADMIN_INCLUDE=/tmp/admin-guard.conf
      - 'KONG_ADMIN_TOKEN=${SERVICE_PASSWORD_KONGADMIN}'
      # The control plane applies the whole declarative config with POST /config (src/kong.ts).
      - 'KONG_PLUGINS=request-transformer,cors,key-auth,acl,request-termination,post-function,basic-auth'
      - 'KONG_DNS_ORDER=LAST,A,CNAME'
      - KONG_DNS_NOT_FOUND_TTL=1
      - KONG_NGINX_WORKER_PROCESSES=2
      - KONG_MEM_CACHE_SIZE=32m
      - KONG_NGINX_PROXY_PROXY_BUFFER_SIZE=160k
      # PostgREST filters like .in('col', [200 hashes]) build ~13 KB URLs; nginx's default
      # 8 KB header buffer answers 414 (same as deploy/coolify/docker-compose.yaml).
      - 'KONG_NGINX_HTTP_LARGE_CLIENT_HEADER_BUFFERS=4 32k'
      - 'KONG_NGINX_PROXY_PROXY_BUFFERS=64 160k'
      - 'KONG_PROXY_ACCESS_LOG=/dev/stdout combined'
    ports:
      - '10.10.0.1:8010:8000'
    networks:
      coolify:
        aliases: [supa-platform-kong]
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 5

  supavisor:
    image: 'supabase/supavisor:2.7.4'
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - PORT=4000
      - 'DATABASE_URL=ecto://postgres:${SERVICE_PASSWORD_PLATFORMDB}@platform-db:5432/_supabase'
      - CLUSTER_POSTGRES=true
      - 'SECRET_KEY_BASE=${SERVICE_PASSWORD_64_SUPAVISORKEYBASE}'
      # 32 characters (Coolify's SERVICE_PASSWORD is 32 letters and digits).
      - 'VAULT_ENC_KEY=${SERVICE_PASSWORD_SUPAVISORVAULT}'
      - 'API_JWT_SECRET=${SERVICE_PASSWORD_64_ADMINJWT}'
      - 'METRICS_JWT_SECRET=${SERVICE_PASSWORD_64_ADMINJWT}'
      - REGION=local
      - 'ERL_AFLAGS=-proto_dist inet_tcp'
      - DB_POOL_SIZE=3
    command: ['/bin/sh', '-c', '/app/bin/migrate && /app/bin/server']
    # A project's Postgres for apps on the gateway host, as on supabase.com: user <role>.<ref>,
    # session mode on 6542 (migrations, anything that needs a whole session), transaction mode on
    # 6543. WireGuard address only.
    ports:
      - '10.10.0.1:6542:5432'
      - '10.10.0.1:6543:6543'
    networks:
      coolify:
        aliases: [supa-platform-supavisor]
    healthcheck:
      test: [CMD, curl, '-sSfL', '-o', /dev/null, 'http://127.0.0.1:4000/api/health']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  realtime:
    image: 'supabase/realtime:v2.76.5'
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      - PORT=4000
      - DB_HOST=platform-db
      - DB_PORT=5432
      - DB_USER=postgres
      - 'DB_PASSWORD=${SERVICE_PASSWORD_PLATFORMDB}'
      - DB_NAME=postgres
      - 'DB_AFTER_CONNECT_QUERY=SET search_path TO _realtime'
      # Realtime needs exactly 16 characters; the command below cuts this 32-character value.
      - 'DB_ENC_KEY=${SERVICE_PASSWORD_REALTIMEENC}'
      - 'API_JWT_SECRET=${SERVICE_PASSWORD_64_ADMINJWT}'
      - 'SECRET_KEY_BASE=${SERVICE_PASSWORD_64_REALTIMEKEYBASE}'
      - 'METRICS_JWT_SECRET=${SERVICE_PASSWORD_64_ADMINJWT}'
      - 'ERL_AFLAGS=-proto_dist inet_tcp'
      - "DNS_NODES=''"
      - RLIMIT_NOFILE=10000
      - APP_NAME=realtime
      # Tenants come from the control plane only; the self-host seed would recreate a default.
      - SEED_SELF_HOST=false
      - RUN_JANITOR=false
      - LOG_LEVEL=error
      - DISABLE_HEALTHCHECK_LOGGING=true
    command: sh -c 'export DB_ENC_KEY=$$(printf %.16s "$$DB_ENC_KEY") && /app/bin/migrate && /app/bin/server'
    networks:
      coolify:
        aliases: [supa-platform-realtime]
    healthcheck:
      test: [CMD, curl, '-sSf', '-o', /dev/null, 'http://127.0.0.1:4000/healthcheck']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-meta:
    image: 'supabase/postgres-meta:v0.99.0'
    environment:
      - PG_META_PORT=8080
      # Studio sends every query with an x-connection-encrypted header (encrypted with
      # PG_META_CRYPTO_KEY). The default connection points nowhere, so a request without that
      # header cannot reach any database.
      - PG_META_DB_HOST=127.0.0.1
      - PG_META_DB_PORT=1
      - PG_META_DB_NAME=none
      - PG_META_DB_USER=none
      - PG_META_DB_PASSWORD=none
      - 'CRYPTO_KEY=${SERVICE_PASSWORD_PGMETA}'
    # On `coolify` to reach the project databases (supabase-db-<uuid>).
    networks:
      coolify:
        aliases: [supa-platform-postgres-meta]

  imgproxy:
    image: 'darthsim/imgproxy:v3.30.1'
    # Sources are presigned MinIO URLs from each project's storage-api; no local files.
    environment:
      - 'IMGPROXY_BIND=:8080'
      - IMGPROXY_USE_ETAG=true
      - IMGPROXY_AUTO_WEBP=true
      - IMGPROXY_MAX_SRC_RESOLUTION=16.8
    networks:
      coolify:
        aliases: [supa-platform-imgproxy]
    healthcheck:
      test: [CMD, imgproxy, health]
      interval: 5s
      timeout: 5s
      retries: 3

  minio:
    image: 'ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z'
    # Buckets (one per project, named after the ref) and their scoped keys are created by the
    # control plane (apps/control-plane/src/minio.ts), so there is no bootstrap container.
    environment:
      - 'MINIO_ROOT_USER=${SERVICE_USER_MINIO}'
      - 'MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}'
      - MINIO_BROWSER=off
    command: 'server /data'
    volumes:
      - 'minio-data:/data'
    networks:
      coolify:
        aliases: [supa-platform-minio]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 20s
      retries: 10

  projects-dir:
    # One-shot: the control plane runs as uid 1000 (also GoTrue's user) and creates <ref>/ in here,
    # so the directory has to be its own. Runs as root on every deploy, then exits.
    image: 'alpine:3.22'
    user: '0'
    restart: 'no'
    exclude_from_hc: true
    entrypoint:
      - /bin/sh
      - '-c'
      - 'chown 1000:1000 /projects && chmod 755 /projects'
    volumes:
      - '/data/supa-platform/projects:/projects'

  control-plane:
    # Coolify builds it on the server from this repo on every deploy (context: the repo root, so
    # the project template is in the build).
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    depends_on:
      projects-dir:
        condition: service_completed_successfully
      platform-db:
        condition: service_healthy
      kong:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - PORT=8080
      # The Coolify API for project stacks. Project and server are this application's own
      # (COOLIFY_RESOURCE_UUID, set by Coolify); the project stacks go into the environment
      # "projects" of the same Coolify project, created when missing (src/coolify.ts).
      - 'COOLIFY_URL=${CONTROL_PLANE_COOLIFY_URL:-https://coolify-admin.example.com/api/v1}'
      - 'COOLIFY_TOKEN=${CONTROL_PLANE_COOLIFY_TOKEN:?}'
      - COOLIFY_ENVIRONMENT=projects
      - 'REGISTRY_DATABASE_URL=postgres://postgres:${SERVICE_PASSWORD_PLATFORMDB}@platform-db:5432/_supabase'
      # 64 hex characters: encrypts every project's secrets in the registry. Losing it loses them.
      - 'PLATFORM_SECRETS_KEY=${SERVICE_HEX_64_SECRETSKEY}'
      - 'CONTROL_PLANE_TOKEN=${SERVICE_PASSWORD_CONTROLPLANE}'
      - 'PROJECT_DOMAIN_SUFFIX=${PROJECT_DOMAIN_SUFFIX:-supa.example.com}'
      - 'PROJECT_S3_ENDPOINT=http://supa-platform-minio:9000'
      - 'PROJECT_IMGPROXY_URL=http://supa-platform-imgproxy:8080'
      - 'KONG_ADMIN_URL=http://kong:8001'
      - 'KONG_ADMIN_TOKEN=${SERVICE_PASSWORD_KONGADMIN}'
      - 'SUPAVISOR_URL=http://supavisor:4000'
      - 'REALTIME_URL=http://realtime:4000'
      - 'PLATFORM_ADMIN_JWT_SECRET=${SERVICE_PASSWORD_64_ADMINJWT}'
      - 'MINIO_URL=http://minio:9000'
      - 'MINIO_ROOT_USER=${SERVICE_USER_MINIO}'
      - 'MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}'
      # Kong routes studio.<suffix> to Studio with basic auth (src/kong.ts, renderDashboard).
      - 'DASHBOARD_URL=http://studio:3000'
      - 'DASHBOARD_USERNAME=${SERVICE_USER_STUDIO}'
      - 'DASHBOARD_PASSWORD=${SERVICE_PASSWORD_STUDIO}'
      # Rendered into each project compose, and bound here at the same path (src/project-dirs.ts).
      - PROJECTS_HOST_DIR=/data/supa-platform/projects
    volumes:
      - '/data/supa-platform/projects:/data/supa-platform/projects'
    ports:
      - '10.10.0.1:8011:8080'
    networks:
      coolify:
        aliases: [supa-platform-control-plane]

  studio:
    # Multi-project Studio (.github/workflows/studio-fork-publish.yml on this branch with
    # multi_project=true), pinned by digest: a new Studio is a commit here, then Redeploy.
    # Every project comes from the control plane (SPEC.md §11-§12).
    image: 'ghcr.io/krowli/supabase-full-access-studio:platform-control-plane@sha256:a9d0db9a2b7617928345f5934ab768c2563e94d0f1d10206b307cc3e7cf16ad2'
    depends_on:
      control-plane:
        condition: service_started
      postgres-meta:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "fetch('http://127.0.0.1:3000/api/platform/profile').then((r) => {if (r.status !== 200) throw new Error(r.status)})"
      timeout: 5s
      interval: 10s
      retries: 3
      start_period: 30s
    environment:
      - HOSTNAME=0.0.0.0
      # The registry: the control plane in this stack (same service network, short name).
      - 'STUDIO_PROJECT_REGISTRY_URL=http://control-plane:8080'
      - 'STUDIO_PROJECT_REGISTRY_TOKEN=${SERVICE_PASSWORD_CONTROLPLANE}'
      - 'STUDIO_PROJECT_DOMAIN_SUFFIX=${PROJECT_DOMAIN_SUFFIX:-supa.example.com}'
      # No single-project stack here: `default` is the project list, not a database (SPEC.md §15).
      - STUDIO_DEFAULT_PROJECT=none
      - 'DEFAULT_ORGANIZATION_NAME=Platform'
      # Shared services. pg-meta only reaches a database through Studio's encrypted header.
      - 'STUDIO_PG_META_URL=http://postgres-meta:8080'
      - 'PG_META_CRYPTO_KEY=${SERVICE_PASSWORD_PGMETA}'
      - 'PLATFORM_ADMIN_JWT_SECRET=${SERVICE_PASSWORD_64_ADMINJWT}'
      - 'SUPAVISOR_URL=http://supavisor:4000'
      - POOLER_PROXY_PORT_TRANSACTION=6543
      - 'REALTIME_URL=http://realtime:4000'
      # Project GoTrue containers fetch email templates from here over the `coolify` network.
      - 'STUDIO_INTERNAL_URL=http://supa-platform-studio:3000'
      - SNIPPETS_MANAGEMENT_FOLDER=/app/snippets
      - ENABLED_FEATURES_AUTHENTICATION_THIRD_PARTY_AUTH=false
      - UPLOAD_FILE_SIZE_LIMIT=524288000
    volumes:
      - 'studio-snippets:/app/snippets'
      # Per-project GoTrue, storage and state files Studio writes (<ref>/{gotrue,storage,state})
      # under its fixed projectsDir; on the host they live under /data/supa-platform/projects.
      - '/data/supa-platform/projects:/data/pieowl/projects'
    networks:
      coolify:
        aliases: [supa-platform-studio]

volumes:
  platform-db-data:
  minio-data:
  studio-snippets:

networks:
  # Coolify's shared network on every server.
  coolify:
    external: true
