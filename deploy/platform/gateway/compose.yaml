# The gateway side of the platform, installed as one Coolify application on the gateway host
# (server A, Coolify's own server): + New → Public Repository → this repo, branch
# platform/control-plane, Build Pack "Docker Compose", Docker Compose Location
# /deploy/platform/gateway/compose.yaml, server localhost. Nothing to fill in.
#
# Every 15 s it writes the Traefik dynamic file that routes every *.<suffix> host to the platform
# Kong on the database server over WireGuard. Traefik's ACME resolver only requests certificates
# for Host() matchers or tls.domains, never for a HostRegexp, and a wildcard needs a DNS challenge.
# So the router matches by HostRegexp and lists each project host in tls.domains; the list comes
# from the control plane's /hosts (public hostnames only). The file is rendered here, from
# validated names, so nothing the control plane returns can reach Traefik's config verbatim. If
# /hosts is unreachable the current file stays. Besides the project refs (20 letters), the one
# label DASHBOARD_LABEL (the control plane's Studio route, kong.ts) gets a certificate too.
# Stopping or deleting this application leaves the last file in place; delete
# /data/coolify/proxy/dynamic/supa-platform.yaml to take the route down.
#
# The script is the command itself, not a `content:` file: Coolify keeps a content file from the
# first deploy and does not rewrite it on the next one, so a change here would not arrive. `$$` is
# a literal `$` for Compose.
services:
  sync:
    image: 'alpine:3.22'
    restart: unless-stopped
    exclude_from_hc: true
    environment:
      - 'SUFFIX=${PROJECT_DOMAIN_SUFFIX:-supa.aioomi.com}'
      - 'HOSTS_URL=${PLATFORM_HOSTS_URL:-http://10.10.0.1:8011/hosts}'
      - 'KONG_URL=${PLATFORM_KONG_URL:-http://10.10.0.1:8010}'
    volumes:
      - '/data/coolify/proxy/dynamic:/dynamic'
    command:
      - /bin/sh
      - '-c'
      - |
        while :; do
          (
          set -eu
          NAME=supa-platform
          OUT=/dynamic/$$NAME.yaml
          DASHBOARD_LABEL=studio

          hosts=$$(wget -q -T 5 -O - "$$HOSTS_URL") || exit 0
          esc=$$(printf '%s' "$$SUFFIX" | sed 's/\./\\./g')
          rule=$$(printf "HostRegexp(\`^[a-z0-9-]+\\\\.%s\$$\`)" "$$esc")
          # Next to the target, so the rename is atomic; Traefik skips files without .yaml.
          tmp=$$(mktemp "/dynamic/.$$NAME.XXXXXX")
          {
            echo "# Managed by deploy/platform/gateway/compose.yaml, a Coolify application on this server. Do not edit."
            echo "http:"
            echo "  middlewares:"
            echo "    $$NAME-https:"
            echo "      redirectScheme: {scheme: https}"
            echo "  routers:"
            echo "    $$NAME-http:"
            printf "      rule: '%s'\n" "$$rule"
            echo "      entryPoints: [http]"
            echo "      middlewares: [$$NAME-https]"
            echo "      service: $$NAME"
            echo "    $$NAME:"
            printf "      rule: '%s'\n" "$$rule"
            echo "      entryPoints: [https]"
            echo "      service: $$NAME"
            echo "      tls:"
            echo "        certResolver: letsencrypt"
            echo "        domains:"
            for h in $$hosts; do
              case "$$h" in
                *."$$SUFFIX") ;;
                *) continue ;;
              esac
              label=$${h%."$$SUFFIX"}
              [ "$$label" = "$$DASHBOARD_LABEL" ] || printf '%s' "$$label" | grep -Eqx '[a-z]{20}' || continue
              echo "          - main: $$h"
            done
            echo "  services:"
            echo "    $$NAME:"
            echo "      loadBalancer:"
            echo "        servers:"
            echo "          - url: $$KONG_URL"
          } > "$$tmp"
          if [ -f "$$OUT" ] && cmp -s "$$tmp" "$$OUT"; then
            rm -f "$$tmp"
          else
            chmod 644 "$$tmp"
            mv "$$tmp" "$$OUT"
          fi
          )
          sleep 15
        done
